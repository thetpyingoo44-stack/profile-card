<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="card-container">
      <img src="assets/images/avatar-jessica.jpeg" alt="people-perfile" class="card-image">
      <h1>Jessica Randall</h1>
      <span>Londan, United Kingdam</span>
      <p class="card-content">"Front-end developer and avid rader."</p>
      <form>
        <a href="https://github.com/"><button>Github</button></a>
        <a href="https://www.frontendmentor.io/"><button>Frontend Mentor</button></a>
        <a href="https://www.linkedin.com/"><button>Linkedin</button></a>
        <a href="https://x.com/?lang=en"><button>Twitter</button></a>
        <a href="https://www.instagram.com/"><button>Instagram</button></a>
        
      </form>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/thetpyingoo44-stack/My-Portfolio">SaungThetPaingOo</a>.
  </footer>

</html>
